name: Build waylandcraft release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. v0.2.21). Leave empty to only build the jar artifacts.'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  compile-native-libs:
    strategy:
      matrix:
        platform:
          - name: linux-gnu-x86_64
            runs-on: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - name: linux-gnu-arm64
            runs-on: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.platform.runs-on }}
    steps:
    - uses: actions/checkout@v6
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config \
          libpipewire-0.3-dev \
          libxkbcommon-dev \
          libdrm-dev \
          libgbm-dev \
          libudev-dev \
          libwayland-dev \
          libegl-dev \
          mesa-common-dev \
          libxcb1-dev \
          libxcb-cursor-dev \
          libxcb-xfixes0-dev \
          libxcb-randr0-dev \
          libxcb-composite0-dev
    - name: Setup rust toolchain
      uses: dtolnay/rust-toolchain@stable
    - name: Compile native library (release)
      working-directory: native/
      run: cargo build --release --target=${{ matrix.platform.target }}
    - name: Move native library
      run: |
        mkdir native-libs
        mv native/target/${{ matrix.platform.target }}/release/libwaylandcraft.so \
          native-libs/libwaylandcraft-${{ matrix.platform.name }}.so
    - name: Collect runtime shared library dependencies
      # Copy the non-glibc .so dependencies (libxkbcommon/libpipewire/...) next to
      # the native lib. Stripped runtimes such as the OnyxLauncher Android JRE have
      # glibc but no libxkbcommon.so.0 / libpipewire-0.3.so.0; bundling them lets
      # the Java side preload them before loading libwaylandcraft.so.
      run: |
        python3 scripts/collect_deps.py native-libs/libwaylandcraft-${{ matrix.platform.name }}.so
        echo "--- bundled deps ---"
        ls -la native-libs/deps/ || true
    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: libwaylandcraft-${{ matrix.platform.name }}
        path: native-libs/
        if-no-files-found: error

  build-java:
    needs: compile-native-libs
    strategy:
      matrix:
        arch:
          - name: x86_64
          - name: arm64
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
    - name: Download native lib
      uses: actions/download-artifact@v8
      with:
        path: native-libs
        pattern: libwaylandcraft-linux-gnu-${{ matrix.arch.name }}
        merge-multiple: true
    - name: Verify native lib
      run: |
        ls -la native-libs/
        ls -la native-libs/deps/ || true
        file native-libs/*.so native-libs/deps/*.so || true
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
    - name: Setup gradle
      uses: gradle/actions/setup-gradle@v6
    - name: Build java code (${{ matrix.arch.name }})
      run: ./gradlew build -PwlArch=${{ matrix.arch.name }}
    - name: Verify jar contents
      run: python3 scripts/verify_jar.py ${{ matrix.arch.name }}
    - name: Upload jar artifact
      uses: actions/upload-artifact@v7
      with:
        name: waylandcraft-jar-${{ matrix.arch.name }}
        path: build/libs/waylandcraft-linux-${{ matrix.arch.name }}.jar
        if-no-files-found: error

  release:
    needs: build-java
    runs-on: ubuntu-24.04
    if: needs.build-java.result == 'success' && (github.event.inputs.tag != '' || github.event_name == 'push')
    steps:
    - name: Download jars
      uses: actions/download-artifact@v8
      with:
        path: jars
        pattern: waylandcraft-jar-*
        merge-multiple: true
    - name: Show jars
      run: |
        ls -la jars/
        sha256sum jars/*.jar
    - name: Create or update GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.event.inputs.tag != '' && github.event.inputs.tag || github.ref_name }}
      run: |
        cd jars
        if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          echo "Release $TAG exists, uploading assets"
          gh release upload "$TAG" *.jar --repo "$GITHUB_REPOSITORY" --clobber
        else
          echo "Creating release $TAG"
          gh release create "$TAG" *.jar --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes "Automated multi-arch release (waylandcraft-linux-x86_64.jar / waylandcraft-linux-arm64.jar)"
        fi
