name: Build waylandcraft release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. v0.2.20). Leave empty to only build the jar artifact.'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  compile-native-libs:
    strategy:
      matrix:
        platform:
          - name: linux-gnu-x86_64
            runs-on: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: linux-gnu-arm64
            runs-on: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.platform.runs-on }}
    steps:
    - uses: actions/checkout@v6
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config \
          libpipewire-0.3-dev \
          libxkbcommon-dev \
          libdrm-dev \
          libgbm-dev \
          libudev-dev \
          libwayland-dev \
          libegl-dev \
          mesa-common-dev \
          libxcb1-dev \
          libxcb-cursor-dev \
          libxcb-xfixes0-dev \
          libxcb-randr0-dev \
          libxcb-composite0-dev
    - name: Setup rust toolchain
      uses: dtolnay/rust-toolchain@stable
    - name: Compile native library (release)
      working-directory: native/
      run: cargo build --release --target=${{ matrix.platform.target }}
    - name: Move native library
      run: |
        mkdir native-libs
        mv native/target/${{ matrix.platform.target }}/release/libwaylandcraft.so \
          native-libs/libwaylandcraft-${{ matrix.platform.name }}.so
    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: libwaylandcraft-${{ matrix.platform.name }}
        path: native-libs/libwaylandcraft-${{ matrix.platform.name }}.so
        if-no-files-found: error

  build-java:
    runs-on: ubuntu-22.04
    needs: compile-native-libs
    steps:
    - uses: actions/checkout@v6
    - name: Download native libs
      uses: actions/download-artifact@v8
      with:
        path: native-libs
        pattern: libwaylandcraft-*
        merge-multiple: true
    - name: Verify native libs
      run: |
        ls -la native-libs/
        file native-libs/*.so || true
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
    - name: Setup gradle
      uses: gradle/actions/setup-gradle@v6
    - name: Build java code
      run: ./gradlew build
    - name: Upload jar artifact
      uses: actions/upload-artifact@v7
      with:
        name: waylandcraft-jar
        path: build/libs/waylandcraft.jar
        if-no-files-found: error
    - name: Create GitHub Release
      if: github.event.inputs.tag != ''
      env:
        GH_TAG: ${{ github.event.inputs.tag }}
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.GH_TAG }}
        files: build/libs/waylandcraft.jar
